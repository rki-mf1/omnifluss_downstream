report_comment: >
  This report has been generated by the <a href="https://github.com/rki-mf1/omnifluss_downstream/tree/dev" target="_blank">rki-mf1/omnifluss_downstream</a>
  analysis pipeline.
report_section_order:
  "nextclade":
    after: "nextclade_provenance" # first nextclade, then dataset provenance
  "rki-mf1-omnifluss_downstream-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "rki-mf1-omnifluss_downstream-summary":
    order: -1002

export_plots: true

disable_version_detection: true

# MultiQC configuration for Nextclade provenance tables
custom_data:
  nextclade_provenance:
    file_format: 'tsv'
    section_name: 'Nextclade Dataset Provenance'
    description: 'Information about the Nextclade datasets used for analysis'
    plot_type: 'table'
    pconfig:
      id: 'nextclade_provenance_table'
      title: 'Dataset Provenance Information'
      col1_header: 'Sample Name'  # Customize first column header if needed
      sortRows: true # Sort by column name
      only_defined_headers: true
      # sort_rows_by: 'Sample Name'  # Use the actual column header
      # sort_rows_order: 'asc'
    headers:
      Sample:
        title: 'Sample'
        description: 'Sample identifier or name'
        scale: false  # Treat as string
      nextclade_index:
        title: 'Nextclade Index'
        description: 'Nextclade sample index number'
        scale: false  # Treat as string
        hidden: true  # Hide this column by default
      nextclade_dataset_tag:
        title: 'Nextclade Dataset Tag'
        description: 'Version tag for the Nextclade dataset'
        scale: false  # Treat as string
      nextclade_dataset_name:
        title: 'Nextclade Dataset Name'
        description: 'Full name of the Nextclade dataset used'
        scale: false  # Treat as string
      nextclade_dataset_shortcut:
        title: 'Nextclade Dataset Shortcut'
        description: 'Shortest shortcut identifier for the dataset'
        scale: false  # Treat as string
      internal_dataset_id:
        title: 'Internal ID'
        description: 'Internal dataset identifier used by the pipeline'
        scale: false  # Treat as string

# Search pattern to find your files
sp:
  nextclade_provenance:
    fn: '*_nextclade_dataset_provenance.tsv'