fn_clean_sample_names: false

report_comment: >
  This report has been generated by the <a href="https://github.com/rki-mf1/omnifluss_downstream/tree/dev" target="_blank">rki-mf1/omnifluss_downstream</a>
  analysis pipeline.
report_section_order:
  "nextclade_provenance":
    after: "per_sample_types" # first nextclade_provenance, then per_sample_types
  "rki-mf1-omnifluss_downstream-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "rki-mf1-omnifluss_downstream-summary":
    order: -1002

export_plots: true

disable_version_detection: true

# MultiQC configuration for Nextclade provenance tables
custom_data:
  nextclade_provenance:
    file_format: 'tsv'
    section_name: 'Nextclade Run'
    description: 'Viral genome alignment, clade assignment, mutation calling, and quality checks (DOI: 10.21105/joss.03773). Nextclade assigns input sequences to SARS-Cov-2 clades based on differences between the input sequences and [Nextstrain](https://nextstrain.org/) reference sequences. In addition, it judges the validity of the samples by performing several quality control checks on the input sequences. For more information about the Nextclade datasets check the [dataset repo](https://github.com/nextstrain/nextclade_data/tree/d9f91600d56dac97ce651fa63306a6122a31d453/data/nextstrain) or the [web interface](https://clades.nextstrain.org/dataset).'
    plot_type: 'table'
    pconfig:
      id: 'nextclade_provenance_table'
      title: 'Dataset Provenance Information'
      col1_header: 'Sample Name'  # Customize first column header if needed
      sortRows: true # Sort by column name
      # only_defined_headers: true
      # sort_rows_by: 'Sample Name'  # Use the actual column header
      # sort_rows_order: 'asc'
    headers:
      Sample Name:
        # title: 'Sample'
        description: 'Sample identifier or name'
        scale: false  # Treat as string
      nextclade.index:
        title: 'Nextclade Index'
        description: 'Nextclade sample index number'
        scale: false  # Treat as string
        hidden: true  # Hide this column by default
      nextclade.clade:
        title: 'Clade'
        description: 'Clade assigned by Nextclade analysis'
        scale: false  # Treat as string
      nextclade.qc.overallStatus:
        title: 'QC Overall Status'
        description: 'Overall quality control status from Nextclade'
      nextclade.qc.missingData.status:
        title: 'QC Missing Data Status'
        description: 'Status of missing data quality control from Nextclade'
      nextclade.qc.mixedSites.status:
        title: 'QC Mixed Sites Status'
        description: 'Status of mixed sites quality control from Nextclade'
      nextclade.dataset.tag:
        title: 'Nextclade Dataset Tag'
        description: 'Version tag for the Nextclade dataset'
        scale: false  # Treat as string
      nextclade.dataset.name:
        title: 'Nextclade Dataset Name'
        description: 'Full name of the Nextclade dataset used'
        scale: false  # Treat as string
      nextclade.dataset.shortcut:
        title: 'Nextclade Dataset Shortcut'
        description: 'Shortest shortcut identifier for the dataset'
        scale: false  # Treat as string
        hidden: true  # Hide this column by default
      nextclade.dataset.reference.name:
        title: 'Nextclade Dataset Reference Name'
        description: 'Reference name of the dataset used by Nextclade'
        scale: false  # Treat as string
      omnifluss.dataset_id:
        title: 'Internal Dataset ID'
        description: 'Internal dataset identifier used by the pipeline'
        scale: false  # Treat as string
        hidden: true  # Hide this column by default
  per_sample_types:
    file_format: 'tsv'
    section_name: 'Per Sample Summary'
    description: 'Per sample analysis results'
    plot_type: 'table'
    pconfig:
      id: 'per_sample_table'
      title: 'Per Sample Results'
      col1_header: 'Sequence Name'  # Customize first column header if needed
      only_defined_headers: true
      no_beeswarm: true
    headers:
      Sequence Name:
        description: 'Name of the sequence analyzed'
        scale: false  # Treat as string
      sample:
          title: 'Sample'
          description: 'Sample identifier or name'
          scale: false  # Treat as string
      omnifluss.reference.clade:
        title: 'Reference Type'
        description: 'Inferred reference type from the input FASTA header (pattern: H\dN\d)'
        scale: false  # Treat as string
      nextclade.dataset.name:
        title: 'Nextclade Dataset Name'
        description: 'Full name of the Nextclade dataset used'
        scale: false  # Treat as string
      omnifluss.mixed_types:
        title: 'Mixed Types'
        description: 'Indicates if the sample contains different types across segments (True/False) based on Nextclade dataset names'
      nextclade.clade:
        title: 'Clade'
        description: 'Clade assigned by Nextclade analysis'
        scale: false  # Treat as string
      nextclade.qc.overallStatus:
        title: 'QC Overall Status'
        description: 'Overall quality control status from Nextclade'
        scale: false  # Treat as string

# Search pattern to find your files
sp:
  nextclade_provenance:
    fn: '*_nextclade_dataset_provenance.tsv'
  per_sample_types:
    fn: '*_types_per_sample.tsv'
