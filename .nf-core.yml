    - manifest.homePage
    - validation.help.beforeText
    - validation.help.afterText
    - validation.summary.beforeText
    - validation.summary.afterText
  readme:
    - nextflow_badge
    - nfcore_template_badge
nf_core_version: 3.4.1
repository_type: pipeline
template:
  author: DimitriTernovoj
  description: Omnifluss pipeline for downstream analyses.
  force: false
  is_nfcore: false
  name: omnifluss_downstream
  org: rki-mf1
  outdir: .
  skip_features:
    - igenomes
    - github_badges
    - gitpod
    - codespaces
    - fastqc
    - adaptivecard
    - slackreport
    - seqera_platform
  version: 0.1.0
