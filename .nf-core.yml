    - conf/igenomes.config
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-omnifluss_downstream_logo_light.png
    - docs/images/nf-core-omnifluss_downstream_logo_light.png
    - docs/images/nf-core-omnifluss_downstream_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
  files_unchanged:
    - .github/CONTRIBUTING.md
